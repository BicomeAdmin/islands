<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FT美療島</title>

<meta property="og:type" content="website">
<meta property="og:title" content="FT美療島｜來島上逛逛">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --ink:#1d2433;--ink-2:#4a5468;--ink-3:#8a93a6;--paper:#fffaf1;--card:#ffffff;--line:#ece4d6;
  --red:#e8412c;--orange:#ff8a3d;--yellow:#ffcf3f;--teal:#12a594;--navy:#14213d;
  --shadow:0 10px 30px rgba(20,33,61,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef1f6;--ink-2:#c3cad6;--ink-3:#8f99ab;--paper:#171f2e;--card:#202a3c;--line:#2d394f;--shadow:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{--ink:#eef1f6;--ink-2:#c3cad6;--ink-3:#8f99ab;--paper:#171f2e;--card:#202a3c;--line:#2d394f;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14213d;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:var(--font);color:inherit;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.isl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:0;border-radius:99px;background:#fffffff0;color:#1d2433;box-shadow:0 4px 14px #14213d40;font:800 13px/1 var(--font);white-space:nowrap;cursor:pointer;pointer-events:auto;transition:box-shadow .2s,opacity .3s}
.isl .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff3d6;font-size:15px}
.isl .heat{width:28px;height:5px;border-radius:3px;background:#e9edf3;overflow:hidden}
.isl .heat i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff6b4a);transition:width .5s}
.isl.sel{box-shadow:0 0 0 3px #ffcf3f,0 6px 18px #14213d55}
.isl.got .ic{background:#ffe08a}
.isl.soon{background:#eceef2e8;color:#687187}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:16px;background:#fffffff2;color:#1d2433;box-shadow:0 6px 18px #14213d29;min-width:0}
.brand>div:last-child{min-width:0}
.logo{flex:none;display:grid;place-items:center;width:36px;height:40px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ff8a4c,#e8412c 70%);color:#fff;font-weight:900;font-size:17px}
.brand b{display:block;font-size:17px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;font-weight:700;color:#8a93a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{flex:none;margin-left:auto;display:flex;align-items:baseline;gap:5px;padding:8px 13px;border-radius:14px;background:#fffffff2;color:#1d2433;box-shadow:0 6px 18px #14213d29}
.count b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.count small{font-size:12px;font-weight:700;color:#4a5468}
.dock{position:fixed;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.dock::-webkit-scrollbar{display:none}
.dk{flex:none;display:flex;align-items:center;gap:5px;height:36px;padding:0 13px;border:0;border-radius:99px;background:#fffffff2;color:#1d2433;box-shadow:0 3px 10px #14213d29;font-weight:800;font-size:14px;cursor:pointer}
.dk.primary{background:linear-gradient(180deg,#ff7448,#e8412c);color:#fff;box-shadow:0 3px #b52a17}
.dk em{font-style:normal;display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e8412c;color:#fff;font-size:11px;font-weight:900}
.panel{position:fixed;z-index:15;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.grab{height:22px;cursor:grab;touch-action:none;flex:none}
.grab i{display:block;width:42px;height:5px;margin:9px auto 0;border-radius:3px;background:#d6ccb8}
.timebar{padding:4px 14px 2px;border-bottom:1px solid var(--line);flex:none}
.tb-row{display:flex;align-items:center;gap:8px}
.days{display:flex;gap:3px}
.days button{width:28px;height:28px;border:0;border-radius:8px;background:var(--line);font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer}
.days button.on{background:var(--navy);color:#fff}
.tb-time{flex:1;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-time small{font-size:12px;font-weight:700;color:var(--ink-3);margin-left:4px}
.tb-play{flex:none;width:34px;height:30px;border:0;border-radius:10px;background:linear-gradient(180deg,#ff7448,#e8412c);color:#fff;font-size:12px;cursor:pointer;box-shadow:0 2px #b52a17}
.tb-play.on{background:var(--navy);box-shadow:0 2px #000}
.range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:12px;margin:9px 0 4px;border-radius:99px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#1f2b56,#1f2b56 20%,#ffcf9e 26%,#bfe3ff 38%,#bfe3ff 66%,#ffb27a 74%,#5b4b7e 80%,#1f2b56 88%,#1f2b56)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid #e8412c;box-shadow:0 2px 8px #0000004d}
.range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #e8412c}
.ticks{position:relative;height:18px;font-size:10.5px;font-weight:700;color:var(--ink-3);margin:0 12px}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.pb{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.pb h2{margin:0 0 6px;font-size:20px;font-weight:900;line-height:1.4}
.pb h2 b{color:var(--red);font-size:26px}
.kicker{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--red)}
.lead{margin:0 0 12px;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.hero{padding:14px;border-radius:18px;background:linear-gradient(140deg,#fff3dc,#ffe2cf);color:#1d2433}
.hero .lead{color:#4a5468;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{padding:10px 6px;border-radius:13px;background:var(--card);text-align:center}
.stats b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--ink-3);font-weight:700}
.stats .up{display:block;font-size:10.5px;color:var(--red);font-weight:800}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:900}
.sec h3 small{margin-left:4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.rows{display:grid;gap:7px}
.row{display:grid;grid-template-columns:4em 1fr 3em;align-items:center;gap:8px;font-size:13px}
.row .rl{font-weight:700}
.rb{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.rb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffbd73,#ff6b4a)}
.rv{text-align:right;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cards{display:grid;gap:8px}
.icard{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 11px 9px 9px;border:0;border-radius:16px;background:var(--card);box-shadow:0 1px var(--line);text-align:left;cursor:pointer}
.icard .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#fff3d6;font-size:23px}
.icard b{display:block;font-size:15px;font-weight:900}
.icard small{display:block;font-size:12px;color:var(--ink-3)}
.icard .n{font-size:18px;font-weight:900;color:var(--red);text-align:right;line-height:1.1}
.icard .n small{font-size:10px;font-weight:700}
.icard.soon{opacity:.6}
.tip{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--yellow);border-radius:4px 12px 12px 4px;background:#fff7de;color:#4a3a10;font-size:13px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;font-weight:700}
.chip b{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:0;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font:800 14.5px/1.2 var(--font);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(180deg,#ff7448,#e8412c);color:#fff;box-shadow:0 3px #b52a17}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.back{border:0;background:none;color:var(--red);font-weight:800;font-size:13px;padding:0;margin-bottom:8px;cursor:pointer}
.note{margin:22px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.mbg{position:absolute;inset:0;background:#14162870;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mcard{position:relative;width:100%;max-width:420px;max-height:calc(100dvh - 40px);overflow-y:auto;padding:24px 20px 20px;border-radius:24px;background:var(--paper);box-shadow:0 24px 60px #0a0e1e59;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.mx{position:absolute;right:12px;top:12px;width:34px;height:34px;border:0;border-radius:50%;background:var(--line);font-size:20px;cursor:pointer}
.mcard h2{margin:0 40px 6px 0;font-size:21px;font-weight:900}
.intro ul{padding:0;margin:14px 0}
.intro li{display:flex;gap:12px;margin:12px 0;list-style:none}
.intro li>span{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#fff0d6;font-size:21px}
.intro li p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.intro li b{display:block;font-size:15px;color:var(--ink)}
.q{font-weight:800;font-size:17px;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.opt:hover{border-color:var(--red)}
.res{text-align:center}
.res .big{font-size:58px;line-height:1.1}
.res h3{font-size:25px;margin:6px 0 4px;font-weight:900}
.res p{margin:4px 0;color:var(--ink-2);font-size:14px;line-height:1.6}
.res .kin{color:var(--ink);font-weight:800}
.share-img{display:block;width:100%;max-width:260px;margin:12px auto 4px;border-radius:16px;box-shadow:0 10px 30px #14213d33}
.joinbox input{width:100%;box-sizing:border-box;margin:14px 0 4px;padding:12px;border:1px solid var(--line,#e5d9cc);border-radius:12px;font:600 14px/1.4 ui-monospace,monospace;color:inherit;background:transparent}
.hint{margin:10px 0 0;font-size:13px;opacity:.75;line-height:1.6}
.phrase{margin:16px 0 6px;padding:22px 16px;border-radius:18px;background:linear-gradient(140deg,#fff3dc,#ffe2cf);color:#1d2433;text-align:center;animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(90deg)}}
.phrase .jp{font-size:26px;font-weight:900;letter-spacing:1px}
.phrase .kana{font-size:13px;color:#8a6a3a;margin-top:2px}
.phrase .zh{font-size:15px;font-weight:700;margin-top:10px}
.phrase .use{font-size:12.5px;color:#6a5a3a;margin-top:6px}
.passport{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;border:3px dashed var(--line);color:var(--ink-3);font-size:12px;font-weight:800;text-align:center;padding:4px}
.stamp span{font-size:26px;filter:grayscale(1);opacity:.5}
.stamp.got{border:3px solid #d7263d;color:#d7263d;transform:rotate(-8deg);background:#fff6f2}
.stamp.got span{filter:none;opacity:1}
.toast{position:fixed;left:50%;top:calc(116px + env(safe-area-inset-top));z-index:50;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:#14213ded;color:#fff;font-size:13.5px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 10%,#ffd9a8,#ff8a5c 38%,#3b2a6b);color:#fff;text-align:center;transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader h1{margin:0 0 6px;font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:clamp(1px,.6vw,4px);text-shadow:0 4px 0 #c2410c}
#loader>div{padding:0 16px;max-width:100vw;box-sizing:border-box}
#loader p{margin:0;font-weight:700;opacity:.9}
/* 不能跑 JS 的地方（Lark 預覽是嚴格 CSP，頁面自己的 script 全被擋）只看得到這張靜態卡 */
#loader .ld-msg{display:none}.js #loader .ld-msg{display:block}.js #loader .ld-static{display:none}
.ld-static{box-sizing:border-box;max-width:min(440px,calc(100vw - 32px));margin:18px auto 0;padding:16px 18px;border-radius:18px;background:#ffffff26;backdrop-filter:blur(6px);font-size:15px;line-height:1.7;font-weight:700}
.ld-static b{font-size:22px}.ld-static small{display:block;margin-top:10px;font-weight:600;opacity:.92}
.ld-static a{color:#fff;word-break:break-all}
@media (max-width:760px){
  .panel{left:0;right:0;bottom:0;height:44dvh;border-radius:22px 22px 0 0;transition:height .3s cubic-bezier(.2,.8,.2,1)}
  .panel.tall{height:84dvh}
  .panel.short{height:128px}
}
@media (min-width:761px){
  .panel{left:16px;top:120px;bottom:16px;width:380px;border-radius:22px}
  .grab{display:none}
  .dock{right:auto}
  .top{left:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){.mcard,.phrase{animation:none}}
</style>
</head>
<body>

<div id="labels"></div>

<header class="top">

<nav class="dock">

  market.tiles.slice(stalls, stalls + nChest).forEach(t => { const c = new THREE.Mesh(new THREE.BoxGeometry(.45, .32, .32), mats.gold); c.position.set(t.x, t.y + .16, t.z); c.castShadow = true; c.userData.y = t.y + .16; market.g.add(c); chests.push(c); });
}
// 建設中（沒有忠誠系統的案）
for (const id of ["shrine", "market"]) if (byId[id].soon) {
  const g = islands[id].g, t = islands[id].tiles[0];
  const crane = new THREE.Mesh(new THREE.BoxGeometry(.15, 2.4, .15), mats.yellow); crane.position.set(t.x, t.y + 1.2, t.z); g.add(crane);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.8, .12, .12), mats.yellow); arm.position.set(t.x + .7, t.y + 2.35, t.z); g.add(arm);
  islands[id].tiles.slice(1, 4).forEach(s => { const b = new THREE.Mesh(new THREE.BoxGeometry(.5, .35, .5), mats.wood); b.position.set(s.x, s.y + .18, s.z); b.castShadow = true; g.add(b); });
}
// 燈塔
const tower = buildIsland(byId.tower);
const tw = new THREE.Group(); tower.g.add(tw); tw.position.y = 1;
[0, 1, 2, 3].forEach(i => { const c = new THREE.Mesh(new THREE.CylinderGeometry(.42 - i * .05, .47 - i * .05, .65, 12), i % 2 ? mats.red : mats.white); c.position.y = .33 + i * .65; c.castShadow = true; tw.add(c); });
const lamp = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .4, 12), winMat); lamp.position.y = 2.9; tw.add(lamp);
const cap = new THREE.Mesh(new THREE.ConeGeometry(.4, .45, 12), mats.red); cap.position.y = 3.32; tw.add(cap);
const beam = new THREE.Mesh(new THREE.ConeGeometry(1.6, 12, 24, 1, true), new THREE.MeshBasicMaterial({color: 0xfff1b8, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending}));
beam.geometry.translate(0, -6, 0); beam.rotation.z = Math.PI / 2;
const beamPivot = new THREE.Group(); beamPivot.position.y = 2.9; beamPivot.add(beam); tw.add(beamPivot);
const towerLight = new THREE.PointLight(0xffd36b, 0, 14); towerLight.position.y = 2.9; tw.add(towerLight);

// 雲
const cloudMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 1, flatShading: true, transparent: true, opacity: .92});
const clouds = [];
for (let i = 0; i < 9; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(.9 + R() * .9, 0), cloudMat); s.position.set(j * 1.1 - 1.6, R() * .5, R() * .8); c.add(s); }
  c.position.set(-40 + R() * 80, 9 + R() * 5, -40 + R() * 70); c.userData.v = .15 + R() * .25; scene.add(c); clouds.push(c);
}

// 船：本週新島民
const boats = [];
const nBoats = Math.max(newWeek > 0 ? 1 : 0, Math.min(8, Math.round(newWeek / 10)));
for (let i = 0; i < nBoats; i++) {
  const b = new THREE.Group();
  b.add(new THREE.Mesh(new THREE.BoxGeometry(1.1, .3, .5), mats.white));
  const sail = new THREE.Mesh(new THREE.ConeGeometry(.35, .9, 3), M(0xff8a3d)); sail.position.y = .6; b.add(sail);
  b.userData = {a: i / nBoats * Math.PI * 2, rad: 5 + R() * 3.5, sp: .08 + R() * .06};
  scene.add(b); boats.push(b);
}

// 光弧：島民從哪裡來（有設名牌的人）
const REG_DIR = {"北部": [-26, -14], "中部": [-30, 6], "南部": [-20, 22], "東部": [6, 26], "海外": [30, 18]};
const arcs = [];
const regMax = Math.max(1, ...Object.values(CH.region || {}));
for (const [reg, n] of Object.entries(CH.region || {})) {
  const [sx, sz] = REG_DIR[reg] || [0, 30], [ex, ez] = byId.dock.pos;
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(sx, .5, sz), new THREE.Vector3((sx + ex) / 2, 6 + n / regMax * 6, (sz + ez) / 2), new THREE.Vector3(ex, 1.2, ez));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, .06 + n / regMax * .14, 6, false), new THREE.MeshBasicMaterial({color: 0xffb84d, transparent: true, opacity: .75})));
  const dot = new THREE.Mesh(new THREE.SphereGeometry(.22, 10, 10), new THREE.MeshBasicMaterial({color: 0xfff1b8})); scene.add(dot);
  arcs.push({curve, dot, t: R()});
}

// ── 時間：星期 × 時段 ────────────────────────────────
const now = new Date();
const state = {w: (now.getDay() + 6) % 7, h: now.getHours(), playing: false, sel: null};
// 當下太冷清就從最熱鬧的時段開場（第一眼要看到島亮著）
if (peak && (grid[`${state.w}-${state.h}`] || 0) < peak[1] * .3) { state.w = peakW; state.h = peakH; }
const SKY = [[0, 0x0b1a33], [5, 0x1f2b56], [6, 0xf7b58a], [8, 0x9fd4ff], [16, 0xa9d8ff], [18, 0xffb27a], [19, 0x5b4b7e], [20, 0x1f2b56], [24, 0x0b1a33]];
const lerpSky = h => { for (let i = 0; i < SKY.length - 1; i++) if (h >= SKY[i][0] && h <= SKY[i + 1][0]) return new THREE.Color(SKY[i][1]).lerp(new THREE.Color(SKY[i + 1][1]), (h - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0])); return new THREE.Color(SKY[0][1]); };
const dayAmt = h => Math.max(0, Math.sin((h - 6) / 13 * Math.PI));
const PERIOD = h => h < 5 ? "深夜" : h < 7 ? "清晨" : h < 11 ? "早上" : h < 13 ? "中午" : h < 17 ? "下午" : h < 19 ? "傍晚" : h < 23 ? "晚上" : "深夜";
function applyTime() {
  const {w, h} = state, d = dayAmt(h), sky = lerpSky(h);
  scene.background = sky; scene.fog.color = sky;
  hemi.intensity = .35 + d * .85; sun.intensity = .15 + d * 1.6;
  const a = (h - 6) / 12 * Math.PI; sun.position.set(Math.cos(a) * 40, Math.max(6, Math.sin(a) * 40), 18);
  sun.color.set(d > .3 ? 0xffffff : 0xffc48a);
  sea.material.color.set(d > .2 ? 0x2f86c4 : 0x173d63);
  // 亮燈＝本週上島比例 ＋ 這個時段群裡的熱度
  const heat = heatAt(w, h), weekShare = HAS_LOY ? last.a7 / last.members : (C.active14 || 0) / Math.max(1, members);
  const litN = Math.round(windows.length * Math.min(1, weekShare * .6 + heat * .9));
  windows.forEach(([a1, a2, gl], i) => { a1.material = a2.material = i < litN ? winMat : winOff; gl.visible = i < litN; });
  winMat.emissiveIntensity = .6 + (1 - d) * 1.6; glowMat.opacity = (1 - d) * .85;
  hemi.color.set(d > .3 ? 0xffffff : 0x9db4ff); hemi.intensity = .6 + d * .6;
  plazaLight.intensity = (1 - d) * (1.5 + heat * 8);
  const isPeak = w === peakW && h === peakH;
  towerLight.intensity = (1 - d) * 3 + (isPeak ? 6 : 0); beam.material.opacity = (1 - d) * (.1 + (isPeak ? .14 : 0)); beam.visible = d < .6;
  $("tbTime").innerHTML = `週${WD[w]} ${String(h).padStart(2, "0")}:00<small>${PERIOD(h)}</small>`;
  $("hour").value = h;
  document.querySelectorAll("#days button").forEach((b, i) => b.classList.toggle("on", i === w));
  updateLabels(true);
  if (!state.sel) renderHome();
  else if (state.sel === "plaza") { const s = pb.scrollTop; pb.innerHTML = detail("plaza"); pb.scrollTop = s; }
}
$("days").innerHTML = WD.map((d, i) => `<button data-w="${i}">${d}</button>`).join("");
$("days").onclick = e => { const b = e.target.closest("button"); if (b) { state.w = +b.dataset.w; applyTime(); } };
$("hour").oninput = e => { state.h = +e.target.value; applyTime(); };
let playT = null;
$("play").onclick = () => {
  state.playing = !state.playing; $("play").classList.toggle("on", state.playing); $("play").textContent = state.playing ? "❚❚" : "▶";
  clearInterval(playT);
  if (state.playing) playT = setInterval(() => { state.h = (state.h + 1) % 24; if (state.h === 0) state.w = (state.w + 1) % 7; applyTime(); }, 700);
};

// ── 標籤（HTML 疊在 3D 上）───────────────────────────
const passport = (() => { try { return new Set(JSON.parse(localStorage.getItem("isl-pass-" + D.case) || "[]")); } catch { return new Set(); } })();
const savePass = () => { try { localStorage.setItem("isl-pass-" + D.case, JSON.stringify([...passport])); } catch {} $("passN").textContent = passport.size; };
savePass();
const islHeat = id => {
  const {w, h} = state, hh = heatAt(w, h);
  return {plaza: hh, dock: Math.min(1, newWeek / 60), shrine: HAS_LOY ? Math.min(1, last.sub7 / 120) : 0,
    market: HAS_LOY ? Math.min(1, last.red7 / 60) : 0, tower: (w === peakW && Math.abs(h - peakH) <= 1) ? 1 : hh * .5}[id];
};
ISL.forEach(def => {
  const b = document.createElement("button");
  b.className = "isl" + (def.soon ? " soon" : "");
  b.innerHTML = `<span class="ic">${def.ic}</span>${def.name}${def.soon ? " · 即將開放" : `<span class="heat"><i></i></span>`}`;

});
const v3 = new THREE.Vector3();
function updateLabels(heatOnly) {
  ISL.forEach(def => {
    const i = def.el.querySelector(".heat i"); if (i) i.style.width = Math.round(islHeat(def.id) * 100) + "%";
    def.el.classList.toggle("sel", state.sel === def.id); def.el.classList.toggle("got", passport.has(def.id));
    if (heatOnly) return;
    v3.set(def.pos[0], def.kind === "tower" ? 5.4 : 3.2, def.pos[1]).project(camera);
    def.el.style.transform = `translate(${(v3.x + 1) / 2 * innerWidth}px,${(1 - v3.y) / 2 * innerHeight}px) translate(-50%,-50%)`;
    const y = (1 - v3.y) / 2 * innerHeight;
    def.el.style.opacity = v3.z < 1 ? Math.max(0, Math.min(1, (y - 110) / 30)) : 0;  // 別壓在上排按鈕底下
  });
}

// ── 面板內容 ─────────────────────────────────────────
const pb = $("pb");
const up = (a, b) => b != null && a > b ? `<span class="up">比上週多 ${fmt(a - b)}</span>` : "";
function heroLine() {
  const {w, h} = state, n = grid[`${w}-${h}`] || 0;
  if (w === peakW && h === peakH) return `現在是全島最亮的時刻！<br>近 ${CH.days || 28} 天的週${WD[w]} ${h}:00，大家${ACT.v} <b>${fmt(n)}</b> ${ACT.u}`;
  if (n === 0) return `週${WD[w]} ${h}:00，島上大家都睡了 💤<br>${peak ? `最熱鬧的是週${WD[peakW]} ${peakH}:00` : "還在等第一位島民來點亮"}`;
  return `週${WD[w]} ${h}:00，島上熱度是最高峰的 <b>${Math.round(n / gmax * 100)}%</b>`;
}
const islandNum = id => ({plaza: [fmt(members), "島民"], dock: ["+" + fmt(newWeek), HAS_LOY ? "本週" : "每週"],
  shrine: HAS_LOY ? [fmt(last.sub7), "次打卡"] : ["—", ""], market: HAS_LOY ? [fmt(last.red7), "次兌換"] : ["—", ""], tower: peak ? [`週${WD[peakW]}`, `${peakH}:00`] : ["—", ""]}[id]);
const islandSub = id => ({plaza: "島民住的地方，燈亮＝有人在", dock: "新島民從這裡上岸", shrine: byId.shrine.soon ? "建設中，即將開放" : "每天打卡、完成任務",
  market: byId.market.soon ? "建設中，即將開放" : "用點數換好禮", tower: peak ? "一週裡最熱鬧的一小時" : "近 28 天還沒有人點亮"}[id]);
const card = d => { const [n, u] = islandNum(d.id); return `<button class="icard${d.soon ? " soon" : ""}" data-isl="${d.id}"><span class="ic">${d.ic}</span><span><b>${d.name}${passport.has(d.id) ? " ✅" : ""}</b><small>${islandSub(d.id)}</small></span><span class="n">${n}<small><br>${u}</small></span></button>`; };
function renderHome() {
  pb.innerHTML = `
    <div class="hero"><p class="kicker">${D.island} · 時間軸上的這一刻</p><h2>${heroLine()}</h2>
      <p class="lead">拉上面的時間軸，看島從清晨到深夜怎麼亮起來；點任何一座島，看那裡在發生什麼。</p></div>
    <div class="stats">
      <div><b>${fmt(members)}</b><span>位島民</span></div>
      <div><b>${fmt(HAS_LOY ? last.a7 : C.active14)}</b><span>${HAS_LOY ? "本週上島" : "兩週內說過話"}</span>${HAS_LOY ? up(last.a7, prev?.a7) : ""}</div>
      <div><b>+${fmt(newWeek)}</b><span>${HAS_LOY ? "本週新島民" : "每週新島民"}</span></div>
    </div>
    <div class="sec"><h3>五座島</h3><div class="cards">${ISL.map(card).join("")}</div></div>
    <div class="cta"><button class="btn primary" data-act="quiz">🧭 測我是哪種島民</button>${D.join_url ? `<a class="btn" href="${D.join_url}" target="_blank" rel="noopener">⛵ 上島</a>` : ""}</div>
    <p class="note">一棟房子 ≈ ${fmt(perHouse)} 位島民。數據更新：${last ? last.d : (CH.as_of || C.as_of || "")}。只呈現全島合計，不含任何個人資料。</p>`;
}
function spark(arr, mark) {
  const mx = Math.max(1, ...arr), W = 340, H = 70, bw = W / 24;
  return `<svg viewBox="0 0 ${W} ${H + 14}" width="100%" style="display:block;background:var(--card);border-radius:12px;padding:6px">${arr.map((v, h) => `<rect x="${h * bw + 1}" y="${H - Math.max(1.5, v / mx * (H - 4))}" width="${bw - 2}" height="${Math.max(1.5, v / mx * (H - 4))}" rx="2" fill="${h === mark ? "#e8412c" : "#ffbd73"}"/>`).join("")}${[0, 6, 12, 18, 23].map(h => `<text x="${h * bw + bw / 2}" y="${H + 12}" font-size="9" text-anchor="middle" fill="#8a93a6">${h}</text>`).join("")}</svg>`;
}
function detail(id) {
  const d = byId[id], back = `<button class="back" data-act="home">← 回群島總覽</button>`;
  const head = (t, lead) => `${back}<p class="kicker">${d.ic} ${d.name}</p><h2>${t}</h2><p class="lead">${lead}</p>`;
  const roles = Object.entries(C.tags || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  if (id === "plaza") return head(`住著 <b>${fmt(members)}</b> 位島民`, `每一棟房子大約住 ${fmt(perHouse)} 位。窗戶亮著，代表那段時間有人在島上。`) +
    `<div class="stats"><div><b>${fmt(HAS_LOY ? last.a7 : C.active14)}</b><span>${HAS_LOY ? "本週上島" : "兩週內說話"}</span></div><div><b>${fmt(CH.speakers)}</b><span>近 ${CH.days || 28} 天${ACT.did}</span></div><div><b>${HAS_LOY ? fmt(last.a1) : fmt(C.joined30)}</b><span>${HAS_LOY ? "今天上島" : "30 天新來"}</span></div></div>` +
    `<div class="sec"><h3>週${WD[state.w]}的一天 <small>每小時大家${ACT.heat}的熱度</small></h3>${spark(dayHeat(state.w), state.h)}</div>` +
    (roles.length ? `<div class="sec"><h3>島上的角色 <small>活躍島民</small></h3><div class="chips">${roles.map(([t, n]) => `<span class="chip">${TYPES[t].e} ${t} <b>${fmt(n)}</b></span>`).join("")}</div></div>` : "") +
    `<div class="tip">想知道你是哪一種？做 3 題小測驗，拿到你的島民身分卡。</div><div class="cta"><button class="btn primary" data-act="quiz">🧭 測我是哪種島民</button></div>`;
  if (id === "dock") {
    const reg = Object.entries(CH.region || {}).sort((a, b) => b[1] - a[1]), rm = Math.max(1, ...reg.map(r => r[1]));
    return head(`${HAS_LOY ? "本週" : "每週大約"} <b>+${fmt(newWeek)}</b> 位新島民上岸`, HAS_LOY ? `近 30 天一共來了 ${fmt(L30.new30)} 位。海上的每一艘船，大約是 10 位新朋友。` : `近 30 天來了 ${fmt(C.joined30)} 位新朋友。`) +
      (reg.length ? `<div class="sec"><h3>島民從哪裡來 <small>有設名牌的 ${fmt(CH.region_tagged)} 位</small></h3><div class="rows">${reg.map(([k, n]) => `<div class="row"><span class="rl">${k}</span><span class="rb"><i style="width:${n / rm * 100}%"></i></span><span class="rv">${fmt(n)}</span></div>`).join("")}</div><p class="lead" style="margin-top:8px">天上的光弧，就是大家從各地出發、來到碼頭的路。</p></div>` : "") +
      (D.join_url ? `<div class="cta"><a class="btn primary" href="${D.join_url}" target="_blank" rel="noopener">⛵ 我也要上島</a></div>` : "");
  }
  if (id === "shrine") return d.soon ? head("神社還在蓋 🏗️", "這裡會是每天打卡、完成任務、累積點數的地方。開放後，每一盞石燈籠都是大家一起完成的任務。") :
    head(`本週完成 <b>${fmt(last.sub7)}</b> 次任務`, `一盞石燈籠 ≈ 15 次打卡。近 30 天一共完成 ${fmt(L30.sub30)} 次。`) +
    `<div class="stats"><div><b>${fmt(last.sub7)}</b><span>本週打卡</span>${up(last.sub7, prev?.sub7)}</div><div><b>${fmt(L30.sub30)}</b><span>30 天打卡</span></div><div><b>${fmt(L30.earned30)}</b><span>30 天發出點數</span></div></div>` +
    (D.app_url ? `<div class="cta"><a class="btn primary" href="${D.app_url}" target="_blank" rel="noopener">⛩️ 去打卡</a></div>` : "");
  if (id === "market") return d.soon ? head("市集還在蓋 🏗️", "這裡會是用點數換好禮的地方。開放後，每一個寶箱都是一次兌換。") :

    (D.app_url ? `<div class="cta"><a class="btn primary" href="${D.app_url}" target="_blank" rel="noopener">🎁 去換好禮</a></div>` : "");
  if (id === "tower" && !peak) return head("燈塔還在等人點亮 🕯️", `近 ${CH.days || 28} 天還沒有人${SYS ? "打卡" : "說話"}。第一個上島的人，就是點亮燈塔的人。`) +
    (D.join_url ? `<div class="cta"><a class="btn primary" href="${D.join_url}" target="_blank" rel="noopener">⛵ 我來點亮</a></div>` : "");
  if (id === "tower") return head(`每週${WD[peakW]} <b>${peakH}:00</b> 全島最亮`, `近 ${CH.days || 28} 天，這個時段大家${SYS ? "" : "在群裡"}${ACT.v} ${fmt(grid[`${peakW}-${peakH}`])} ${ACT.u}，是一週裡最熱鬧的一小時。`) +
    `<div class="sec"><h3>週${WD[peakW]}的一天</h3>${spark(dayHeat(peakW), peakH)}</div>` +
    `<div class="cta"><button class="btn primary" data-act="jump">⏱ 把時間撥到週${WD[peakW]} ${peakH}:00</button></div>`;
}
pb.onclick = e => {
  const c = e.target.closest("[data-isl]"); if (c) return select(c.dataset.isl);

// ── 選島：鏡頭飛過去、蓋章 ───────────────────────────
let fly = null;
const HOME_T = new THREE.Vector3(0, 0, 0);
function select(id) {
  state.sel = id;
  const target = id ? new THREE.Vector3(byId[id].pos[0], 0, byId[id].pos[1]) : HOME_T.clone();
  const dir = camera.position.clone().sub(controls.target).normalize();
  fly = {t: 0, fromT: controls.target.clone(), toT: target, fromP: camera.position.clone(), toP: target.clone().add(dir.multiplyScalar(id ? 20 : 46))};
  if (id) {
    pb.innerHTML = detail(id); pb.scrollTop = 0;
    if (!passport.has(id) && !byId[id].soon) {
      passport.add(id); savePass(); toast(`📒 護照蓋章：${byId[id].name}`);
      if (passport.size === ISL.filter(i => !i.soon).length) setTimeout(() => { burst(); toast("🎉 你逛完整座群島，成為榮譽島民！"); }, 700);
    }
  } else renderHome();
  $("panel").classList.remove("short");

      if (navigator.canShare({files: [file]})) { await navigator.share({files: [file], text: `${text}\n${url}`}); return; }
